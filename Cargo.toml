[package]
name = "limner"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "A ratatui markdown renderer with tables, bordered code blocks, optional syntax highlighting, image placeholders, and styled headings"
readme = "README.md"
repository = "https://github.com/Sylviromi/limner"
documentation = "https://docs.rs/limner"
authors = ["Sylviromi"]
rust-version = "1.81"
keywords = ["ratatui", "markdown", "tui", "terminal", "renderer"]
categories = ["rendering", "command-line-interface"]

[features]
default = []
image-protocol = ["dep:ratatui-image", "dep:image"]
syntax-highlighting = ["dep:syntect"]

[dependencies]
pulldown-cmark = "0.13"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
unicode-width = "0.2"

ratatui-image = { version = "11", default-features = false, features = ["crossterm"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"], optional = true }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"], optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
crossterm = "0.29"
ureq = "2"
image = "0.25"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }